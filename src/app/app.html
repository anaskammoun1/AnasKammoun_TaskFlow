<div
  class="min-h-screen transition-colors"
  [class.dark-mode]="themeService.isDarkMode()"
>
  <header class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 p-6 pb-0">
    <app-view-toggle
      [activeView]="activeView()"
      (viewChange)="changeView($event)"
    />

    <button
      type="button"
      (click)="themeService.toggleTheme()"
      class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-700 transition hover:bg-gray-100 dark-theme-button"
    >
      {{ themeService.isDarkMode() ? 'Mode clair' : 'Mode sombre' }}
    </button>
  </header>

  @if (activeView() === 'user') {
    <app-user-list />
  }

  @if (activeView() === 'task') {
    <app-project-list />
  }
</div>
