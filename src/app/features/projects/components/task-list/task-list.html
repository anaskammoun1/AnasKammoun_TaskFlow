<div class="mt-4">

  <h3 class="font-semibold text-gray-800 mb-3">Tâches</h3>

  @if (tasks().length === 0) {
    <p class="text-gray-500 italic">Aucune tâche.</p>
  } @else {

    <!-- Filter buttons -->
    <div class="flex gap-2 mb-3 flex-wrap">
      <button
        type="button"
        class="px-3 py-1 rounded-full text-sm border"
        [ngClass]="selectedStatus() === ''
          ? 'bg-gray-800 text-white'
          : 'bg-white text-gray-700'"
        (click)="selectedStatus.set('')"
      >
        Toutes
      </button>

      @for (s of statuses; track s) {
        <button
          type="button"
          class="px-3 py-1 rounded-full text-sm border"
          [ngClass]="selectedStatus() === s
            ? 'bg-gray-800 text-white'
            : 'bg-white text-gray-700'"
          (click)="selectedStatus.set(s)"
        >
          {{ s }}
        </button>
      }
    </div>

    <!-- Task list -->
    <div class="space-y-3">
      @for (
        task of (
          selectedStatus() === ''
            ? tasks()
            : (tasks() | filterBy:'status':selectedStatus())
        );
        track task.id
      ) {
        <app-task-item
          [task]="task"
          [showAssignee]="showAssignee()"
          [assigneeName]="getAssigneeName(task.assigneeId)"
          (taskStatusChange)="onTaskStatusChange($event)"
        />
      } @empty {
        <p class="text-gray-500 italic">
          Aucune tâche pour ce statut.
        </p>
      }
    </div>
  }

</div>
