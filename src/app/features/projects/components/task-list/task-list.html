<div class="mt-4">

  <h3 class="font-semibold text-gray-800 mb-3">
    Tâches
  </h3>

  @if (tasks().length === 0) {

    <p class="text-gray-500 italic">
      Aucune tâche.
    </p>

  } @else {

    <div class="space-y-3">

      @for (task of tasks(); track task.id) {

        <div
          class="p-3 rounded-lg border-l-4 bg-gray-50"
          [class.border-green-500]="task.status === 'Terminé'"
          [class.border-yellow-500]="task.status === 'En cours'"
          [class.border-gray-400]="task.status === 'En attente'"
        >

          <div class="flex justify-between items-center">

            <span class="font-medium text-gray-800">
              {{ task.title }}
            </span>

            <span class="text-sm text-gray-600">
              {{ task.priority }}
            </span>

          </div>

          <p class="text-sm mt-1">
            Statut :

            <span
              class="font-semibold"
              [class.text-green-600]="task.status === 'Terminé'"
              [class.text-yellow-600]="task.status === 'En cours'"
              [class.text-gray-500]="task.status === 'En attente'"
            >
              {{ task.status }}
            </span>
          </p>

        </div>

      }

    </div>

  }

</div>
